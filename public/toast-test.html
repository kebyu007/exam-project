<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toast Test</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="container my-5">
    <h1 class="mb-4">Toast Notification Test</h1>
    
    <div class="card">
      <div class="card-body">
        <h5 class="card-title mb-3">Test qilish</h5>
        <div class="d-flex gap-2 flex-wrap">
          <button class="btn btn-success" onclick="testSuccess()">Success</button>
          <button class="btn btn-danger" onclick="testError()">Error</button>
          <button class="btn btn-warning" onclick="testWarning()">Warning</button>
          <button class="btn btn-info" onclick="testInfo()">Info</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/toast.js"></script>
  <script>
    function testSuccess() {
      console.log('Testing success toast');
      Toast.success('Bu muvaffaqiyatli xabar');
    }
    
    function testError() {
      console.log('Testing error toast');
      Toast.error('Bu xatolik xabari');
    }
    
    function testWarning() {
      console.log('Testing warning toast');
      Toast.warning('Bu ogohlantirish xabari');
    }
    
    function testInfo() {
      console.log('Testing info toast');
      Toast.info('Bu ma\'lumot xabari');
    }

    // Page load test
    console.log('Toast object:', Toast);
    console.log('Page loaded, ready to test');
  </script>
</body>
</html>
